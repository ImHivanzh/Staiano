name: Build Windows da GitHub
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions: {}
concurrency:
  group: staiano-windows-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.head.outputs.commit }}
      changed: ${{ steps.head.outputs.changed }}
    steps:
      - id: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_PUBLISH_TOKEN: ${{ secrets.LICENSE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch('https://api.github.com/repos/ImHivanzh/Staiano/branches/main', { headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "User-Agent": "Staiano-release" }, redirect: 'error' });
          if (!response.ok) throw new Error(`GitHub HTTP ${response.status}`);
          const commit = (await response.json()).commit.sha;
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error('Invalid commit');
          const status = await fetch('https://licenses.ivanbuonocore.dev/publish/status', { headers: { Authorization: `Bearer ${process.env.LICENSE_PUBLISH_TOKEN}` }, redirect: 'error' });
          if (!status.ok) throw new Error(`Licenses HTTP ${status.status}`);
          const current = await status.json();
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\nchanged=${current.commit !== commit}\n`);
          NODE
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Scarica esattamente la revisione richiesta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.check.outputs.commit }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('ImHivanzh:'+$env:GITHUB_TOKEN))
          $env:GIT_CONFIG_COUNT='1'
          $env:GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0='AUTHORIZATION: Basic '+$auth
          git init source
          Set-Location source
          git fetch --depth=1 https://github.com/ImHivanzh/Staiano.git $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Fetch non riuscito' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git rev-parse HEAD) -ne $env:SOURCE_COMMIT) { throw 'Revisione non coerente' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Dipendenze, test e pacchetto
        working-directory: source/STAIANO-3D
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Dipendenze non installate' }
          node scripts/sync-pdf-worker.mjs
          npm test -- --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { throw 'Test falliti' }
          node scripts/build-executable.mjs
          if ($LASTEXITCODE -ne 0) { throw 'EXE non compilato' }
          & .\dist-exe\StaianoHVAC.exe --version --data-dir "$env:RUNNER_TEMP\StaianoData"
          if ($LASTEXITCODE -ne 0) { throw 'EXE non avviabile' }
      - name: Pubblica pacchetto immutabile
        working-directory: source/STAIANO-3D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_PUBLISH_TOKEN: ${{ secrets.LICENSE_PUBLISH_TOKEN }}
        run: node scripts/publish-executable.mjs
