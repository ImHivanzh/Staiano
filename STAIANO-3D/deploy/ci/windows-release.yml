# Template GitLab CI facoltativo: include dalla .gitlab-ci.yml dopo aver configurato un runner Windows.
stages: [release]
windows-release:
  stage: release
  tags: [windows]
  resource_group: staiano-windows-release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
  script:
    - Set-Location STAIANO-3D
    - if ((node --version) -ne 'v24.14.0') { throw 'Richiesto Node 24.14.0' }
    - npm ci
    - if ($LASTEXITCODE -ne 0) { throw 'Dipendenze non installate' }
    - npm test -- --maxWorkers=2
    - if ($LASTEXITCODE -ne 0) { throw 'Test falliti' }
    - node scripts/build-executable.mjs
    - if ($LASTEXITCODE -ne 0) { throw 'EXE non compilato' }
    - node scripts/publish-executable.mjs
    - if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione fallita' }
